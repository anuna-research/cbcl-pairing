[package]
name = "cbcl-pairing"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
description = "Reusable blind pairing endpoints and relay for SPEC-072"

[lib]
name = "cbcl_pairing"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
relay = ["std"]

[dependencies]
aes-gcm = { version = "=0.11.0", default-features = false, features = ["aes", "alloc", "zeroize"] }
cbcl-core = { git = "https://codeberg.org/anuna/cbcl-rs", rev = "febc6691e6dd2d5f7116b1a4d84c984b64717564" }
cbcl-parser = { git = "https://codeberg.org/anuna/cbcl-rs", rev = "febc6691e6dd2d5f7116b1a4d84c984b64717564" }
cbor2 = "1.1"
cddl-cat = { version = "0.7", default-features = false, features = ["ciborium"] }
ciborium = "0.2"
fiat-crypto = { version = "=0.3.0", default-features = false }
hmac = { version = "=0.13.0", features = ["zeroize"] }
hkdf = "=0.13.0"
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
subtle = "2.6"
url = "2.5"
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["zeroize"] }
zeroize = "1.8"

[dev-dependencies]
hex = "0.4"

[[bin]]
name = "cbcl-pairing-relay"
path = "src/bin/cbcl-pairing-relay.rs"
required-features = ["relay"]
