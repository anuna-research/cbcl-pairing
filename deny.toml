[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "simplest-path"
skip = [
    { crate = "block-buffer@0.10.4", reason = "curve25519-dalek and the pinned cbcl-rs SHA-256 stack have not migrated to RustCrypto digest 0.11" },
    { crate = "cpufeatures@0.2.17", reason = "curve25519-dalek and the pinned cbcl-rs SHA-256 stack have not migrated to cpufeatures 0.3" },
    { crate = "crypto-common@0.1.7", reason = "curve25519-dalek and the pinned cbcl-rs SHA-256 stack have not migrated to RustCrypto crypto-common 0.2" },
    { crate = "digest@0.10.7", reason = "curve25519-dalek and the pinned cbcl-rs SHA-256 stack have not migrated to RustCrypto digest 0.11" },
    { crate = "fiat-crypto@0.2.9", reason = "curve25519-dalek 4.1.3 pins fiat-crypto 0.2 while the CPace field implementation uses reviewed fiat-crypto 0.3" },
    { crate = "getrandom@0.4.3", reason = "tungstenite 0.30 uses rand 0.10 while relay key generation supports Rust 1.85 through getrandom 0.3" },
    { crate = "r-efi@6.0.0", reason = "this target-only duplicate follows tungstenite's getrandom 0.4 dependency" },
    { crate = "rand_core@0.6.4", reason = "x25519-dalek 2.0 has not migrated to rand_core 0.10 used by tungstenite's rand dependency" },
    { crate = "sha2@0.10.9", reason = "the exact cbcl-rs proof revision and curve25519-dalek still use SHA-2 0.10" },
    { crate = "syn@1.0.109", reason = "cddl-cat 0.7.1 uses the historical strum_macros 0.23 derive stack" },
    { crate = "syn@2.0.119", reason = "current cryptographic derive crates use syn 2 while current serde derives use syn 3" },
    { crate = "thiserror@1.0.69", reason = "cddl-cat 0.7.1 has not migrated to thiserror 2 used by tungstenite" },
    { crate = "thiserror-impl@1.0.69", reason = "this follows cddl-cat's reviewed thiserror 1 dependency" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = ["https://codeberg.org/anuna/cbcl-rs"]
