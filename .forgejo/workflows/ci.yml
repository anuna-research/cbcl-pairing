name: conformance

on:
  push:
  pull_request:

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Advisory, licence, duplicate, and source policy
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          arguments: --all-features
      - name: Fuzz-harness supply-chain policy
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          arguments: --all-features
          manifest-path: fuzz/Cargo.toml

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85 toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain 1.85.0 --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.85.0 --profile minimal \
            --component clippy,rustfmt
          rustup default 1.85.0
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Maximum-message recognition work bound
        run: cargo test --release --test recognition test_023_maximum_adversarial_wire_message_has_bounded_recognition_work -- --exact
      - name: Required security mutations
        run: tools/run-mutations.sh
