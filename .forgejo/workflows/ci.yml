name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny 0.20.2
        run: |
          SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          if ! command -v cc >/dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y build-essential pkg-config curl
          fi
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-deny --version 0.20.2 --locked
          cargo-deny --version
      - name: Advisory, licence, duplicate, and source policy
        run: cargo-deny --all-features --manifest-path ./Cargo.toml check
      - name: Fuzz-harness supply-chain policy
        run: cargo-deny --all-features --manifest-path fuzz/Cargo.toml check

  rust:
    name: rust (${{ matrix.gate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - static
          - test-core
          - test-service
          - test-process
          - test-targets
          - recognition
          - mutations
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85 toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain 1.85.0 --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.85.0 --profile minimal \
            --component clippy,rustfmt
          rustup default 1.85.0
          rustc --version
          cargo --version
      - name: Run ${{ matrix.gate }} gate
        run: |
          case "${{ matrix.gate }}" in
            static)
              cargo fmt --check
              cargo clippy --all-targets --all-features -- -D warnings
              ;;
            test-core)
              cargo test --lib --all-features
              for target in assurance_properties cbcl_protocol channel context \
                cpace dialects endpoint profiles recognition; do
                cargo test --all-features --test "$target"
              done
              ;;
            test-service)
              for target in limiter_observability mailbox relay_service \
                relay_work_bounds storage; do
                cargo test --all-features --test "$target"
              done
              ;;
            test-process)
              for target in independent_endpoint relay_process websocket_process; do
                cargo test --all-features --test "$target"
              done
              ;;
            test-targets)
              cargo test --bins --examples --all-features
              ;;
            recognition)
              cargo test --release --test recognition \
                test_023_maximum_adversarial_wire_message_has_bounded_recognition_work \
                -- --exact
              ;;
            mutations)
              tools/run-mutations.sh
              ;;
          esac
