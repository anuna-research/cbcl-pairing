name: conformance

on:
  push:
  pull_request:

jobs:
  supply-chain:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Advisory, licence, duplicate, and source policy
        uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          arguments: --all-features

  rust:
    runs-on: docker
    container:
      image: rust:1.85-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Required security mutations
        run: tools/run-mutations.sh
